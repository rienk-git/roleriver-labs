name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Start DynamoDB Local
        run: docker compose -f infrastructure/docker/compose.yml -p roleriver-ci up -d
      - name: Wait for DynamoDB Local
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:18000/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run isolated persistence integration tests
        env:
          ROLERIVER_DYNAMODB_TEST: "1"
          ROLERIVER_DYNAMODB_TEST_URL: http://127.0.0.1:18000
        run: pnpm test:integration
      - name: Stop DynamoDB Local
        if: always()
        run: docker compose -f infrastructure/docker/compose.yml -p roleriver-ci down
